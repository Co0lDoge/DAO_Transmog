name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test (x86 Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout DAO_Transmog
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout DAOLib
        uses: actions/checkout@v4
        with:
          repository: Whocares66-Dev/DAOLib
          path: DAOLib-master
          submodules: recursive

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Set Environment Variables
        shell: pwsh
        run: |
          echo "DAOLIB_DIR=$env:GITHUB_WORKSPACE/DAOLib-master" >> $env:GITHUB_ENV
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x86-windows-static-md `
            -DDAOLIB_DIR="${{ github.workspace }}/DAOLib-master"

      - name: Build DAOTransmog
        run: cmake --build build --config Release

      - name: Run Unit Tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DAOTransmog-Release
          path: build/daolib/plugins/DAOTransmog/
